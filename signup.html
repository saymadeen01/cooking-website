<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Cooking Essentials</title>
    <style>
        body { font-family:'Segoe UI',sans-serif; background:#f9f9f9; text-align:center; padding:50px; }
        .container { background:white; padding:40px; max-width:400px; margin:auto; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
        h1 { color:#ff6b3c; margin-bottom:20px; }
        input { width:90%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ccc; }
        button { background:#ff6b3c; color:white; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; transition:0.3s; }
        button:hover { background:#e55a2c; }
        a { display:block; margin-top:15px; color:#ff6b3c; text-decoration:none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Create Account</h1>
    <input type="text" id="name" placeholder="Full Name"><br>
    <input type="email" id="email" placeholder="Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="signup()">Sign Up</button>
    <a href="login.html">Already have an account? Login</a>
</div>

<script>
    function signup() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if(!name || !email || !password){ alert("All fields are required"); return; }

        let users = JSON.parse(localStorage.getItem("users")) || [];
        if(users.find(u => u.email === email)){ alert("Email already exists"); return; }

        users.push({name, email, password});
        localStorage.setItem("users", JSON.stringify(users));
        alert("Signup successful! Please login.");
        window.location.href = "login.html";
    }
</script>
</body>
</html>
