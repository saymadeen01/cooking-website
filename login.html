<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Cooking Essentials</title>
    <style>
        body { font-family:'Segoe UI',sans-serif; background:#f9f9f9; text-align:center; padding:50px; }
        .container { background:white; padding:40px; max-width:400px; margin:auto; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
        h1 { color:#ff6b3c; margin-bottom:20px; }
        input { width:90%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ccc; }
        button { background:#ff6b3c; color:white; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; transition:0.3s; }
        button:hover { background:#e55a2c; }
        a { display:block; margin-top:15px; color:#ff6b3c; text-decoration:none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Login</h1>
    <input type="email" id="email" placeholder="Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <a href="signup.html">Don't have an account? Sign Up</a>
</div>

<script>
    function login() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        let users = JSON.parse(localStorage.getItem("users")) || [];
        const user = users.find(u => u.email === email && u.password === password);

        if(user){
            localStorage.setItem("loggedInUser", JSON.stringify(user));
            alert("Login successful!");
            window.location.href = "index.html"; // redirect to homepage
        } else {
            alert("Invalid email or password!");
        }
    }
</script>
</body>
</html>
